name: Daily Cron Job at 8 AM

on:
  schedule:
    - cron: "30 2 * * *"

  workflow_dispatch:

jobs:
  daily-job:
    runs-on: ubuntu-latest

    steps:
      - name: Start Message
        run: echo "Daily job started!"

      - name: Display Date and Time
        run: date

      - name: Completion Message
        run: echo "Daily job completed successfully!"
